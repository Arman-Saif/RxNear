<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website identity -->
    <title>RxNear | Find Pharmacies Near You</title>
    <meta
      name="description"
      content="Find nearby pharmacies with RxNear. Discover pharmacy locations, view details, explore routes, and access emergency contact information when you need it."
    />
    <meta name="application-name" content="RxNear" />
    <meta name="author" content="RxNear" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon and app icons -->
    <link rel="icon" type="image/png" href="/rxnear_logo.png" />
    <link rel="apple-touch-icon" href="/rxnear_logo.png" />

    <!-- Browser theme colors -->
    <meta name="theme-color" content="#EDF5F8" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RxNear" />
    <meta property="og:title" content="RxNear | Find Pharmacies Near You" />
    <meta
      property="og:description"
      content="Discover nearby pharmacies, explore locations, and find emergency contact information with RxNear."
    />
    <meta property="og:image" content="/rxnear_logo.png" />

    <!-- Twitter sharing -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RxNear | Find Pharmacies Near You" />
    <meta
      name="twitter:description"
      content="Find nearby pharmacies and explore pharmacy locations with RxNear."
    />
    <meta name="twitter:image" content="/rxnear_logo.png" />

    <!-- App entry -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
